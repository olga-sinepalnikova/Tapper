version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tapper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/migrations:/docker-entrypoint-initdb.d

  app:
    build:
      context: ../app
      dockerfile: ../app/Dockerfile
    container_name: gin-app-container
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tapper
    depends_on:
      - postgres

volumes:
  postgres_data:
